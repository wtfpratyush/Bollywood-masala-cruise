<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4b3df5" />
    <meta name="robots" content="index, follow" />
    <meta name="description" content="Bollywood Masala Cruise - A Luxury Indian Cruise Experience" />

    <!-- Open Graph / Twitter defaults (static fallback for crawlers that don't
         execute JS, e.g. social link-unfurl bots; per-route tags are set at
         runtime by src/components/RouteSeo.jsx for browser tabs and JS-rendering crawlers) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bollywood Masala Cruise" />
    <meta property="og:title" content="Bollywood Masala Cruise" />
    <meta property="og:description" content="Bollywood Masala Cruise - A Luxury Indian Cruise Experience" />
    <meta property="og:image" content="%PUBLIC_URL%/images/hero-cruise-ship.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bollywood Masala Cruise" />
    <meta name="twitter:description" content="Bollywood Masala Cruise - A Luxury Indian Cruise Experience" />
    <meta name="twitter:image" content="%PUBLIC_URL%/images/hero-cruise-ship.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Most-used Poppins files (latin 400/700), fetched in parallel with the font CSS -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
        href="https://fonts.gstatic.com/s/poppins/v24/pxiEyp8kv8JHgFVrJJfecnFHGPc.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
        href="https://fonts.gstatic.com/s/poppins/v24/pxiByp8kv8JHgFVrLCz7Z1xlFd2JQEk.woff2" />
    <!-- Load font CSS without blocking first paint; display=swap keeps text visible meanwhile -->
    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
            rel="stylesheet" />
    </noscript>

    <!-- Preload the hero/LCP image that <Hero> renders above the fold (see
         src/components/Hero.jsx: <picture> swaps at the sm breakpoint, 640px) -->
    <!-- Homepage only: on other routes this would waste bandwidth needed by their banner -->
    <script>
      if (location.pathname === "/") {
        [["(max-width: 639px)", "/images/hero-cruise-ship-mobile.jpg"],
         ["(min-width: 640px)", "/images/hero-cruise-ship.jpg"]].forEach(function (p) {
          var l = document.createElement("link");
          l.rel = "preload"; l.as = "image"; l.media = p[0];
          l.href = "%PUBLIC_URL%" + p[1];
          l.setAttribute("fetchpriority", "high");
          document.head.appendChild(l);
        });
      }
    </script>

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <title>Bollywood Masala Cruise</title>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "Bollywood Masala Cruise",
      "description": "Bollywood Masala Cruise - A Luxury Indian Cruise Experience",
      "logo": "https://customer-assets-cm19k8pv.emergentagent.net/job_cruise-ui-rebuild/artifacts/sygz0ryx_6703ef1648d826625eaf84ea.png",
      "image": "https://customer-assets-cm19k8pv.emergentagent.net/job_cruise-ui-rebuild/artifacts/sygz0ryx_6703ef1648d826625eaf84ea.png",
      "telephone": "587-982-4004",
      "email": "bookings@exotikexcursions.com"
    }
    </script>
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
</body>

</html>
